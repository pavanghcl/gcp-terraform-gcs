name: Terraform OIDC

on:
  push:
    branches: [ "main" ]

jobs:
  terraform:
    runs-on: ubuntu-latest

    permissions:
      id-token: write   # 🔥 REQUIRED for OIDC
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/687582285482/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "terraform-sa@terraform-gcp-493407.iam.gserviceaccount.com"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve \
         # -var="project_id=PROJECT_ID" \
         # -var="region=asia-south1" \
         # -var="bucket_name=pavan-oidc-demo-123"
